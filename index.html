<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body {
      background: linear-gradient(to bottom right, #f1f5f9, #e2e8f0); /* soft slate gradient */
      min-height: 100%;
    }
    ::selection {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body class="text-slate-800 font-sans antialiased">
  <div class="max-w-3xl mx-auto p-6 space-y-6">
    <!-- Header -->
    <header class="text-center">
      <h1 class="text-2xl font-semibold text-slate-700">Quick Access</h1>
      <p class="text-sm text-slate-500">Minimal, fast, and feels like part of your browser.</p>
    </header>

    <!-- Search Box -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 space-y-3">
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="Search Google..." class="flex-1 h-10 px-3 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-slate-300" />
        <button onclick="handleGoogleSearch()" class="px-4 h-10 bg-slate-700 text-white rounded-md text-sm flex items-center gap-2 hover:bg-slate-800">
          <i data-lucide="search" class="w-4 h-4"></i> Search
        </button>
        <button onclick="handleLucky()" class="px-4 h-10 bg-slate-100 text-slate-700 rounded-md text-sm flex items-center gap-2 hover:bg-slate-200">
          <i data-lucide="chrome" class="w-4 h-4"></i> I'm Feeling Lucky
      </div>
      <div class="text-xs text-slate-400">Shortcut: Press <kbd class="px-1 py-0.5 bg-slate-200 rounded">S</kbd> to focus</div>
    </div>

    <!-- Image Upload Portal -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 space-y-4">
      <div class="flex items-center gap-2">
        <i data-lucide="camera" class="w-5 h-5 text-slate-600"></i>
        <h2 class="text-sm font-medium text-slate-600">Search by Image</h2>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <button onclick="openNew('https://lens.google.com/upload')" class="h-10 bg-slate-700 text-white rounded-md text-sm flex items-center justify-center gap-2 hover:bg-slate-800">
          <i data-lucide="upload" class="w-4 h-4"></i> Upload to Google Lens
        </button>
        <button onclick="openNew('https://www.bing.com/visualsearch')" class="h-10 bg-slate-100 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2 hover:bg-slate-200">
          <i data-lucide="image" class="w-4 h-4"></i> Bing Visual Search
        </button>
      </div>
      <div class="flex gap-2">
        <input id="imgUrlInput" type="text" placeholder="Paste image URL..." class="flex-1 h-10 px-3 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-slate-300" />
        <button onclick="handleImageByUrl()" class="px-4 h-10 bg-slate-700 text-white rounded-md text-sm flex items-center gap-2 hover:bg-slate-800">
          <i data-lucide="link" class="w-4 h-4"></i> Search by URL
        </button>
      </div>
      <p class="text-xs text-slate-400">Note: Upload opens in a new tab for privacy and security.</p>
    </div>

    <!-- Quick Links -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
      <h2 class="text-sm font-medium text-slate-600 mb-2">Quick Links</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <button onclick="openNew('https://mail.google.com/')" class="h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2">
          <i data-lucide="mail" class="w-4 h-4"></i> Gmail
        </button>
        <button onclick="openNew('https://www.google.com/')" class="h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2">
          <i data-lucide="search" class="w-4 h-4"></i> Google
        </button>
        <button onclick="openNew('https://drive.google.com/')" class="h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2">
          <i data-lucide="hard-drive" class="w-4 h-4"></i> Drive
        </button>
        <button onclick="openNew('https://www.youtube.com/')" class="h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2">
          <i data-lucide="youtube" class="w-4 h-4"></i> YouTube
        </button>
        <button onclick="openNew('https://maps.google.com/')" class="h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2">
          <i data-lucide="map-pin" class="w-4 h-4"></i> Maps
        </button>
        <button onclick="openNew('https://github.com/')" class="h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm flex items-center justify-center gap-2">
          <i data-lucide="github" class="w-4 h-4"></i> GitHub
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 pt-4">
      <p>Designed to blend into your browser. Add to home screen for 1‑tap access.</p>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    function openNew(url) {
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function handleGoogleSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (query) openNew(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
    }
    
    function handleLucky() {
      const query = searchInput.value.trim();
      if (query) openNew(`https://www.google.com/search?q=${encodeURIComponent(query)}&btnI=I`);
    }

    function handleImageByUrl() {
      const url = document.getElementById("imgUrlInput").value.trim();
      if (url) openNew(`https://lens.google.com/uploadbyurl?url=${encodeURIComponent(url)}`);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "s") {
        e.preventDefault();
        document.getElementById("searchInput").focus();
      }
    });
  </script>
</body>
</html>
