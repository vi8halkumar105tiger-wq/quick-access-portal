<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Access Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 20px;
      background: #343a40;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
    }
    footer {
      margin-top: 40px;
      padding: 15px;
      background: #f1f1f1;
      font-size: 14px;
    }
    a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>🌙 Quick Access Portal</header>

  <div class="grid">
    <div class="card">
      <a href="https://mail.google.com" target="_blank">
        <img src="https://www.svgrepo.com/show/303161/gmail-icon-logo.svg" alt="Gmail">
        <div>Gmail</div>
      </a>
    </div>

    <div class="card">
      <a href="https://photos.google.com" target="_blank">
        <img src="https://www.svgrepo.com/show/475656/photo.svg" alt="Google Photos">
        <div>Google Photos</div>
      </a>
    </div>

    <div class="card">
      <a href="https://onedrive.live.com" target="_blank">
        <img src="https://www.svgrepo.com/show/452045/onedrive.svg" alt="OneDrive">
        <div>OneDrive</div>
      </a>
    </div>

    <div class="card">
      <a href="https://www.pinterest.com" target="_blank">
        <img src="https://www.svgrepo.com/show/452229/pinterest-1.svg" alt="Pinterest">
        <div>Pinterest</div>
      </a>
    </div>

    <div class="card">
      <a href="https://www.pw.live" target="_blank">
        <img src="https://www.svgrepo.com/show/452234/book.svg" alt="Physics Wallah">
        <div>Physics Wallah</div>
      </a>
    </div>

    <div class="card">
      <a href="https://example.com" target="_blank">
        <img src="https://www.svgrepo.com/show/452030/star.svg" alt="Custom">
        <div>Custom</div>
      </a>
    </div>
  </div>

  <footer>
    Inspired by your Edge Full Moon theme 🌑
  </footer>
</body>
</html>
