<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, #000000, #000000, #000000);
    }
    ::selection {
      background-color: #64748b;
      color: #fff;
    }
  </style>
</head>
<body class="text-slate-800 font-sans antialiased">
  <div class="max-w-3xl mx-auto p-6 space-y-8">
    <header class="text-center space-y-1">
  <h1 class="text-3xl font-semibold text-white tracking-tight">⚡ Quick Access</h1>
  <p class="text-sm text-white">Your fast lane to Google, Gmail, Lens & more.</p>
</header>

    <!-- Search Box -->
    <div class="bg-white/80 backdrop-blur border border-slate-200 rounded-2xl shadow-md hover:shadow-lg transition p-6 space-y-4">
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="Search Google..." 
               class="flex-1 h-11 px-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400/50 transition" />
        <button onclick="handleGoogleSearch()" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-800 text-white hover:bg-slate-900 active:scale-95 transition">
          <i data-lucide="search" class="w-4 h-4"></i> Search
        </button>
        <button onclick="handleLucky()" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Lucky
        </button>
      </div>
      <p class="text-xs text-slate-400">Press <kbd class="px-1.5 py-0.5 bg-slate-200 rounded">S</kbd> to focus instantly.</p>
    </div>

    <!-- Image Search -->
    <div class="bg-white/80 backdrop-blur border border-slate-200 rounded-2xl shadow-md hover:shadow-lg transition p-6 space-y-5">
      <div class="flex items-center gap-2 text-slate-600">
        <i data-lucide="camera" class="w-5 h-5"></i>
        <h2 class="text-sm font-semibold">Search by Image</h2>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <button onclick="openNew('https://lens.google.com/upload')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-800 text-white hover:bg-slate-900 active:scale-95 transition">
          <i data-lucide="upload" class="w-4 h-4"></i> Google Lens
        </button>
        <button onclick="openNew('https://www.bing.com/visualsearch')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="image" class="w-4 h-4"></i> Bing Visual
        </button>
      </div>
      <div class="flex gap-2">
        <input id="imgUrlInput" type="text" placeholder="Paste image URL..." 
               class="flex-1 h-11 px-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400/50 transition" />
        <button onclick="handleImageByUrl()" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-800 text-white hover:bg-slate-900 active:scale-95 transition">
          <i data-lucide="link" class="w-4 h-4"></i> Search URL
        </button>
      </div>
      <p class="text-xs text-slate-400">Note: Image uploads always open in a new tab for privacy.</p>
    </div>

    <!-- Quick Links -->
    <div class="bg-white/80 backdrop-blur border border-slate-200 rounded-2xl shadow-md hover:shadow-lg transition p-6">
      <h2 class="text-sm font-semibold text-slate-600 mb-3">Quick Links</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <button onclick="openNew('https://mail.google.com/')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="mail" class="w-4 h-4"></i> Gmail
        </button>
        <button onclick="openNew('https://www.google.com/')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="search" class="w-4 h-4"></i> Google
        </button>
        <button onclick="openNew('https://drive.google.com/')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="hard-drive" class="w-4 h-4"></i> Drive
        </button>
        <button onclick="openNew('https://www.youtube.com/')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="youtube" class="w-4 h-4"></i> YouTube
        </button>
        <button onclick="openNew('https://maps.google.com/')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="map-pin" class="w-4 h-4"></i> Maps
        </button>
        <button onclick="openNew('https://github.com/')" 
                class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
          <i data-lucide="github" class="w-4 h-4"></i> GitHub
        </button>

    <button onclick="openNew('https://www.pinterest.com/')" 
            class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
      <i data-lucide="image" class="w-4 h-4"></i> Pinterest
    </button>
    <button onclick="openNew('https://outlook.live.com/')" 
            class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
      <i data-lucide="inbox" class="w-4 h-4"></i> Outlook
    </button>
    <button onclick="openNew('https://onedrive.live.com/')" 
        class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="cloud" class="w-4 h-4"></i> OneDrive
</button>
    <button onclick="openNew('https://chat.openai.com/')" 
            class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
      <i data-lucide="message-square" class="w-4 h-4"></i> ChatGPT
    </button>
    <button onclick="openNew('https://copilot.microsoft.com/')" 
            class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
      <i data-lucide="sparkles" class="w-4 h-4"></i> Copilot
    </button>

      <!-- PW -->
<button onclick="openNew('https://www.pw.live/')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="book-open" class="w-4 h-4"></i> PW
</button>

<!-- Perplexity -->
<button onclick="openNew('https://www.perplexity.ai/')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="bot" class="w-4 h-4"></i> Perplexity
</button>

<!-- eKalyan -->
<button onclick="openNew('https://ekalyan.cgg.gov.in/studentLogin.do?studLoginType=pms')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="graduation-cap" class="w-4 h-4"></i> eKalyan
</button>

<!-- SmallPDF -->
<button onclick="openNew('https://smallpdf.com/#r=app')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="file-text" class="w-4 h-4"></i> SmallPDF
</button>

<!-- 10015.io -->
<button onclick="openNew('https://10015.io/')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="layers" class="w-4 h-4"></i> 10015.io
</button>

<!-- Pixabay -->
<button onclick="openNew('https://pixabay.com/')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="camera" class="w-4 h-4"></i> Pixabay
</button>

<!-- Survey of India -->
<button onclick="openNew('https://surveyofindia.gov.in/')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="map" class="w-4 h-4"></i> Survey of India
</button>

<!-- Indian Law System -->
<button onclick="openNew('https://www.perplexity.ai/spaces/indian-law-system-WTpMpNwMQ3qwiEwuY6ThxA')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="gavel" class="w-4 h-4"></i> Indian Law
</button>

<!-- Google Scholar -->
<button onclick="openNew('https://scholar.google.com/')" 
  class="h-11 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition">
  <i data-lucide="book" class="w-4 h-4"></i> Scholar
</button>


      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 pt-6">
      <p>Made with ♥ | Save as a PWA for 1-tap browser speed dial.</p>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    function openNew(url) {
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function handleGoogleSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (query) openNew(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
    }
    
    function handleLucky() {
      const query = document.getElementById("searchInput").value.trim();
      if (query) openNew(`https://www.google.com/search?q=${encodeURIComponent(query)}&btnI=I`);
    }

    function handleImageByUrl() {
      const url = document.getElementById("imgUrlInput").value.trim();
      if (url) openNew(`https://lens.google.com/uploadbyurl?url=${encodeURIComponent(url)}`);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "s") {
        e.preventDefault();
        document.getElementById("searchInput").focus();
      }
    });
  </script>
</body>
</html>
