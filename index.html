  <!-- Search -->
  <section class="max-w-6xl w-full mx-auto px-4 sm:px-6 mt-8">
    <div class="glass rounded-2xl p-5 shadow-lg">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="flex items-center gap-2">
          <label class="text-sm text-[var(--muted)]">Engine</label>
          <select id="engine" class="glass border rounded-lg px-3 py-2 text-sm">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="youtube">YouTube</option>
            <option value="wikipedia">Wikipedia</option>
          </select>
        </div>
        <div class="flex-1 flex gap-2">
          <input id="searchInput" type="text" placeholder="Type to search..."
                 class="flex-1 glass border rounded-lg px-3 py-2 text-sm" autocomplete="off"/>
          <button id="searchBtn"
                  class="glass px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 hover:shadow-md">
            <i data-lucide="search" class="w-4 h-4"></i> Search
          </button>
          <button id="luckyBtn"
                  class="glass px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2 hover:shadow-md">
            <i data-lucide="sparkles" class="w-4 h-4"></i> Lucky
          </button>
        </div>
      </div>
      <p class="mt-2 text-xs text-[var(--muted)]">Shortcuts: <span class="kbd">S</span>/<span class="kbd">/</span> focus, <span class="kbd">G</span> Gmail, <span class="kbd">Y</span> YouTube, <span class="kbd">M</span> Maps,<span class="kbd">P</span> Pw</p>
    </div>
  </section>

  <!-- Image Search -->
  <section class="max-w-6xl w-full mx-auto px-4 sm:px-6 mt-6">
    <div class="glass rounded-2xl p-5 shadow-lg">
      <div class="flex items-center gap-2 text-[var(--muted)] mb-3">
        <i data-lucide="camera" class="w-5 h-5"></i>
        <h3 class="text-sm font-semibold">Search by image</h3>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <button class="glass px-4 py-2 rounded-lg text-sm flex items-center justify-center gap-2 hover:shadow-md"
                onclick="openNew('https://lens.google.com/upload')">
          <i data-lucide="upload" class="w-4 h-4"></i> Google Lens
        </button>
        <button class="glass px-4 py-2 rounded-lg text-sm flex items-center justify-center gap-2 hover:shadow-md"
                onclick="openNew('https://www.bing.com/visualsearch')">
          <i data-lucide="image" class="w-4 h-4"></i> Bing Visual
        </button>
      </div>
      <div class="flex gap-2 mt-3">
        <input id="imgUrlInput" type="text" placeholder="Paste image URL..."
               class="flex-1 glass border rounded-lg px-3 py-2 text-sm"/>
        <button class="glass px-4 rounded-lg text-sm flex items-center justify-center gap-2 hover:shadow-md"
                onclick="handleImageByUrl()">
          <i data-lucide="link" class="w-4 h-4"></i> Search URL
        </button>
      </div>
    </div>
  </section>

  <!-- Filters -->
  <section class="max-w-6xl w-full mx-auto px-4 sm:px-6 mt-8">
    <div class="flex flex-wrap items-center gap-2">
      <button data-filter="all" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">All</button>
      <button data-filter="google" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">Google</button>
      <button data-filter="work" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">Work</button>
      <button data-filter="study" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">Study</button>
      <button data-filter="media" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">Media</button>
      <button data-filter="tools" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">Tools</button>
      <button data-filter="india" class="filter-btn glass px-3 py-1.5 rounded-lg text-sm">India</button>
    </div>
  </section>

  <!-- Quick Links Grid -->
  <section class="max-w-6xl w-full mx-auto px-4 sm:px-6 mt-4 mb-8">
    <div id="appGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
  </section>

  <!-- Footer -->
  <footer class="mt-auto w-full">
    <div class="glass border-t">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-5 text-center text-sm text-[var(--muted)]">
         <a href="time.php" class="nav-link">&copy; <span id="year"></span> QuickHub. Built with ❤️ by Vishal</a>
      </div>
    </div>
  </footer>

  <script>
    // Icons
    lucide.createIcons();
    document.getElementById('year').textContent = new Date().getFullYear();

    // Open in new tab
    function openNew(url) { window.open(url, "_blank", "noopener,noreferrer"); }

    // Search
    function engineUrl(engine, q, lucky=false) {
      if (engine === 'google') return lucky
        ? `https://www.google.com/search?q=${encodeURIComponent(q)}&btnI=1`
        : `https://www.google.com/search?q=${encodeURIComponent(q)}`;
      if (engine === 'bing') return `https://www.bing.com/search?q=${encodeURIComponent(q)}`;
      if (engine === 'youtube') return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
      if (engine === 'wikipedia') return `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(q)}`;
      return `https://www.google.com/search?q=${encodeURIComponent(q)}`;
    }

    function doSearch(lucky=false) {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const engine = document.getElementById('engine').value;
      openNew(engineUrl(engine, q, lucky));
    }

    document.getElementById('searchBtn').addEventListener('click', () => doSearch(false));
    document.getElementById('luckyBtn').addEventListener('click', () => doSearch(true));
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doSearch(false); }
    });

    // Shortcuts
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 's' || k === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); }
      if (k === 'g') openNew('https://mail.google.com/');
      if (k === 'y') openNew('https://www.youtube.com/');
      if (k === 'm') openNew('https://maps.google.com/');
      if (k === 'p') openNew('https://www.pw.live/study/batches/study?child_url=%2Fstudy');
    });

    // Image search by URL
    function handleImageByUrl() {
      const url = document.getElementById("imgUrlInput").value.trim();
      if (url) openNew(`https://lens.google.com/uploadbyurl?url=${encodeURIComponent(url)}`);
    }
    window.handleImageByUrl = handleImageByUrl;
    window.openNew = openNew;

    // Quick links dataset
    const links = [
      // Google
      { id:'gmail',     name:'Gmail',     url:'https://mail.google.com/', icon:'mail',        cat:'google' },
      { id:'google',    name:'Google',    url:'https://www.google.com/',  icon:'search',      cat:'google' },
      { id:'drive',     name:'Drive',     url:'https://drive.google.com/',icon:'hard-drive',  cat:'google' },
      { id:'maps',      name:'Maps',      url:'https://maps.google.com/', icon:'map-pin',     cat:'google' },
      { id:'scholar',   name:'Scholar',   url:'https://scholar.google.com/', icon:'book-open',cat:'study'  },
      { id:'pw',   name:'PW',   url:'https://www.pw.live/study/batches/study?child_url=%2Fstudy', icon:'book',cat:'study'  },
      { id:'youtube',   name:'YouTube',   url:'https://www.youtube.com/', icon:'youtube',     cat:'media'  },
      { id:'un',   name:'United Nation',   url:'https://www.un.org/en', icon:'globe',     cat:'media'  },

      // Microsoft
      { id:'outlook',   name:'Outlook',   url:'https://outlook.live.com/', icon:'inbox',      cat:'work'   },
      { id:'onedrive',  name:'OneDrive',  url:'https://onedrive.live.com/', icon:'cloud',     cat:'work'   },

      // Dev/Work
      { id:'github',    name:'GitHub',    url:'https://github.com/',       icon:'github',     cat:'work'   },
      { id:'perplexity',name:'Perplexity',url:'https://www.perplexity.ai/', icon:'bot',       cat:'work'   },
      { id:'smallpdf',  name:'SmallPDF',  url:'https://smallpdf.com/',     icon:'file-text',  cat:'tools'  },
      { id:'10015',     name:'10015.io',  url:'https://10015.io/',         icon:'wrench',     cat:'tools'  },

      // Media/Creative
      { id:'pinterest', name:'Pinterest', url:'https://www.pinterest.com/',icon:'image',      cat:'media'  },
      { id:'pixabay',   name:'Pixabay',   url:'https://pixabay.com/',      icon:'images',     cat:'media'  },

      // AI
      { id:'chatgpt',   name:'ChatGPT',   url:'https://chat.openai.com/',  icon:'message-square', cat:'work' },
      { id:'copilot',   name:'Copilot',   url:'https://copilot.microsoft.com/', icon:'sparkles', cat:'work' },
      { id:'ck12',   name:'CK-12',   url:'https://www.ck12.org/student/', icon:'presentation', cat:'study' },
      { id:'khanacedemy',   name:'Khanacedemy',   url:'https://www.khanacademy.org/', icon:'book-open-check', cat:'study' },

      // India / Gov
      { id:'ekalyan',   name:'eKalyan',   url:'https://ekalyan.bih.nic.in/', icon:'building', cat:'india' },
      { id:'soi',       name:'Survey of India', url:'https://www.surveyofindia.gov.in/', icon:'map', cat:'india' },
      { id:'indianlaw', name:'Indian Law', url:'https://legislative.gov.in/', icon:'scale',   cat:'india' },

      // Utilities
      { id:'weather',   name:'Weather',   url:'https://www.google.com/search?q=weather', icon:'cloud-sun', cat:'tools' },
      { id:'finance',   name:'Finance',   url:'https://www.google.com/finance/', icon:'wallet', cat:'tools' },
      { id:'watch',     name:'Watch',     url:'https://time.is/', icon:'clock', cat:'tools' },
      { id:'msn-games', name:'MSN Games', url:'https://www.msn.com/en-in/play', icon:'gamepad-2', cat:'media' },
      { id:'poki',      name:'Poki',      url:'https://poki.com/', icon:'gamepad', cat:'media' },
    ];

    // Render quick links with filters
    const appGrid = document.getElementById('appGrid');
    function linkCard(item) {
      return `
        <button onclick="openNew('${item.url}')" class="glass rounded-xl p-3 card text-left w-full">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-white/10 flex items-center justify-center">
              <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="text-sm font-medium">${item.name}</div>
              <div class="text-xs text-[var(--muted)]">${item.cat}</div>
            </div>
          </div>
        </button>
      `;
    }
    function renderGrid(filter='all') {
      const items = links.filter(x => filter === 'all' ? true : x.cat === filter)
                         .sort((a,b) => a.name.localeCompare(b.name));
      appGrid.innerHTML = items.map(linkCard).join('');
      lucide.createIcons();
    }
    renderGrid('all');

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = btn.getAttribute('data-filter');
        renderGrid(f);
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ring-2','ring-indigo-400'));
        btn.classList.add('ring-2','ring-indigo-400');
      });
    });
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('ring-2','ring-indigo-400');
  </script>
